name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: scripts/check-release-admission.sh "$GITHUB_REF_NAME"
      - run: scripts/check-wire-compatibility-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/sema-wire-compatibility"
      - run: scripts/build-release.sh
        env:
          VERSION: ${{ github.ref_name }}
          WIRE_COMPATIBILITY_REPORT: ${{ runner.temp }}/sema-wire-compatibility/wire-compatibility-matrix.json
      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
